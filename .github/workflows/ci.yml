# Lint, typecheck, unit tests, and the end-to-end shader tests on every
# push to dev or main and on pull requests. Deploys (deploy-pages.yml)
# stay gated on typecheck only, so a flaky browser run never blocks a
# release; this workflow is where the red X shows up.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test tests/unit

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Shader tests
        run: bun run test:e2e
        env:
          CI: "1"

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
